<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Example</title>
  <!-- TODO 1: Add the Bootstrap link here. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      /* TODO 4: Use flexbox to center the card in the vertical and horizontal center.*/
      .flex-container{
        display: flex;
        flex-direction: row;
        justify-content: center;
      }
      
      .card-group{
        height: 100vh;
        width: 40vh;
        display: flex;
        flex-direction: row;
        align-items: center;

      }
    </style>
    
</head>

<body>
  <div class="flex-container">
    <!-- TODO 2: Add the Bootstrap Prebuilt Card here -->
    <div class="card-group">
      <div class="card">
        <img src="https://preview.redd.it/tidying-up-comfyui-workflow-for-sdxl-to-fit-it-on-16-9-v0-qasmv4i83teb1.png?width=640&crop=smart&auto=webp&s=fae462d6b282a3bf197eed8a86beb7ce14fe8f68" class="card-img-top" alt="Robotic Cat" />
        <div class="card-body">
          <h5 class="card-title">Artificial Cat</h5>
          <p class="card-text">I'm in energy-saving mode.</p>
          <a href="https://taimoursohail.com/" target="_blank" class="btn btn-primary">Go somewhere</a>
        </div>
        <div class="card-footer text-body-secondary">
          4 days ago
        </div>
      </div>
    <!-- TODO 3: Change the image src to display the flower.jpg image. -->
  </div>
</body>

</html>
